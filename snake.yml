name: Gerar cobra das contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F5A524&color_dots=#E8E2D6,#9CC3C8,#4F8C94,#1E5A66,#0B2530
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F5A524&color_dots=#0F2A33,#12404D,#1E5A66,#4F8C94,#F5A524

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
